services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: selectiq
      POSTGRES_USER: selectiq
      POSTGRES_PASSWORD: selectiq
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selectiq -d selectiq"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - selectiq-postgres:/var/lib/postgresql/data

volumes:
  selectiq-postgres:
